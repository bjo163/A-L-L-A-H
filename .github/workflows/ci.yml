name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev to main
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            [[ "$HEAD" == "dev" && "$BASE" == "main" && "$HEAD_REPO" == "$REPO" ]] || {
              echo 'Only dev -> main from this repository is allowed.'; exit 1;
            }
          else
            [[ "$BRANCH" == "dev" || "$BRANCH" == "main" ]]
          fi

  quality:
    name: Quality checks
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: build-${{ runner.os }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml', 'turbo.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm run typecheck
      - run: pnpm exec turbo run test
      - run: pnpm run build
