name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev to main
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            [[ "$HEAD" == "dev" && "$BASE" == "main" && "$HEAD_REPO" == "$REPO" ]] || {
              echo 'Only dev -> main from this repository is allowed.'; exit 1;
            }
          else
            [[ "$BRANCH" == "dev" || "$BRANCH" == "main" ]]
          fi

  quality:
    name: Quality checks
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm run module:test
      - run: node --test scripts/tests/*.test.mjs
      - run: pnpm exec turbo run test
      - run: pnpm run build
      - run: pnpm run typecheck
      - name: Dependency vulnerabilities (high and critical)
        run: pnpm audit --prod --audit-level high

  docker-deployment:
    name: Docker deployment
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose --env-file infra/docker.env.example -f infra/compose.yaml config --quiet
      - name: Build API image
        run: docker build --pull -f apps/api/Dockerfile -t empire-api:ci .
      - name: Build Portal image
        run: docker build --pull -f apps/portal/Dockerfile -t empire-portal:ci .
      - name: Build Command Center image
        run: docker build --pull -f apps/command-center/Dockerfile -t empire-command-center:ci .

  release:
    name: Version and changelog
    if: github.event_name == 'push'
    needs: [quality, docker-deployment]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-ledger
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Publish versioned source and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs

  promote-dev:
    name: Promote dev to main
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.docker-deployment.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.release.result == 'success') ||
        (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main' && needs.release.result == 'skipped')
      )
    needs: [quality, docker-deployment, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Open or update promotion PR and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_number="$PR_NUMBER"
          else
            pr_number="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')"
          fi
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head dev \
              --title "Promote dev to main" \
              --body "Automated promotion after successful dev CI, Docker builds, and prerelease publication. GitHub auto-merge will wait for main's required checks."
            pr_number="$(gh pr view dev --json number --jq '.number')"
          fi
          is_draft="$(gh pr view "$pr_number" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" == "true" ]]; then
            echo "PR #$pr_number is still a draft; auto-merge will be enabled when it is marked ready."
            exit 0
          fi
          gh pr merge "$pr_number" --auto --merge

  sync-dev:
    name: Sync main back to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, docker-deployment, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Merge promoted main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev main
          git switch --create dev --track origin/dev
          git merge --no-edit origin/main
          git push origin dev
