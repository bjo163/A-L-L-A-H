name: empire-of-the-light

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: empire
      POSTGRES_DB: empire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empire -d empire"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgres://empire:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/empire
      FILE_STORAGE_DIR: /workspace/var/private-files
      FILE_STORAGE_SIGNING_SECRET: ${FILE_STORAGE_SIGNING_SECRET:?Set FILE_STORAGE_SIGNING_SECRET in .env}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env},http://localhost:3300,http://localhost:3400
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:4000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000"
    volumes:
      - private_files:/workspace/var/private-files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/v1/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [public, backend]

  portal:
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3300
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORTAL_PORT:-3300}:3300"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [public]

  command-center:
    build:
      context: ..
      dockerfile: apps/command-center/Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3400
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${COMMAND_CENTER_PORT:-3400}:3400"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3400/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [public]

volumes:
  postgres_data:
  private_files:

networks:
  public:
  backend:
    internal: true
