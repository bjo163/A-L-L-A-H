name: empire-of-the-light

x-frontend: &frontend
  restart: unless-stopped
  depends_on:
    api:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-empire}
      POSTGRES_DB: ${POSTGRES_DB:-empire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-empire} -d ${POSTGRES_DB:-empire}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-empire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-empire}
      FILE_STORAGE_DIR: /workspace/var/private-files
      FILE_STORAGE_SIGNING_SECRET: ${FILE_STORAGE_SIGNING_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_ORIGIN:-http://localhost:3300,http://localhost:3400}}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:4000}
      EMPIRE_OWNER_PASSWORD: ${EMPIRE_OWNER_PASSWORD:-}
      EMPIRE_ARCHITECT_PASSWORD: ${EMPIRE_ARCHITECT_PASSWORD:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - private_files:/workspace/var/private-files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/v1/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  portal:
    <<: *frontend
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:4000}
    ports:
      - "${PORTAL_PORT:-3300}:3300"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  command-center:
    <<: *frontend
    build:
      context: .
      dockerfile: apps/command-center/Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: /api
    environment:
      API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://api:4000}
    ports:
      - "${COMMAND_CENTER_PORT:-3400}:3400"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3400/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  private_files:



